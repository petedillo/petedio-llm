# CI — lint, typecheck, test, and compile the artifact a deploy would ship.
#
# Copied from templates/api in petedio-workspace. It follows pete-bot's `ci`
# workflow: one runtime (Bun), no Node, so a test cannot pass on a module the
# shipped binary lacks. `--frozen-lockfile` fails the job when bun.lock is stale
# or missing, so an install never silently resolves new versions.
#
# Each step runs a package.json script. A script that does not exist fails the
# step, so a renamed script cannot turn a check into a green no-op.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The floor in package.json's engines.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Compile the standalone binary
        run: |
          bun run build:binary
          test -x dist/petedio-llm

      # Auth never falls open: with no Access settings the binary must refuse to start, exit code 2.
      - name: Smoke-test the binary
        run: |
          rc=0; ./dist/petedio-llm || rc=$?
          test "$rc" -eq 2
